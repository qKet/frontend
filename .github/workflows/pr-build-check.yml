# #######################################
# pr-build-check.yml
# dev,release,main 브랜치 PR 생성시 동작
# Node.js 20으로 프론트엔드 빌드 잘 되는지 체킹
# #######################################

name: PR Build Check

on:
  pull_request:
    branches:
      - dev # feature -> dev
      - release # dev -> release
      - main # release -> main

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
