# #######################################
# secret-scan.yml
# dev,release,main 브렌치 PR 생성시 동작
# 민감한 키 정보같은거 없는지 체킹
#
# 2026-08-19: gitleaks/gitleaks-action(공식 Action 래퍼)은 org 소속 private 저장소에서
# 라이선스(GITLEAKS_LICENSE)를 요구해서 제거함. 대신 그 안에서 실제 스캔을 하는 Gitleaks
# 본체(CLI, MIT 라이선스 완전 무료)를 직접 받아서 실행 — 탐지 결과/동작은 동일하고
# 라이선스 요구만 없어짐.
# #######################################
name: Secret Scan

on:
  pull_request:
    branches:
      - dev # feature -> dev
      - release # dev -> release
      - main # release -> main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect leaked secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan secrets with Gitleaks
        run: gitleaks detect --source . --verbose --redact --exit-code 1
