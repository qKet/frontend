# #######################################
# CI-main.yml
# main 브랜치에 push 시 frontend 이미지 빌드 + ECR push + qKet/CD write-back까지 담당 — prod용.
# CI-release.yml과 거의 동일, 다른 점은 트리거 브랜치(main), Toss 키를 가져오는 Secrets Manager
# 시크릿(-prod, release는 -release), write-back 대상 파일(helm/values-prod.yaml)뿐.
#
# 배포(CD)는 argoCD가 담당:
#   - namespace/ingress/networkpolicy → Infra/kubernetes (ArgoCD Application "infra-manifests")
#   - Deployment/Service              → qKet/CD (ArgoCD Application "qket-cd-prod")
#
# qKet/CD write-back 인증: GitHub App(qket-ci-bot, qKet 조직 소유, CD 레포에만 설치,
# Contents:Read-and-write 권한만) — PAT 대신 이 방식을 쓴 이유는 장기 자격증명을 시크릿에
# 안 두기 위해서(QKET_CI_APP_PRIVATE_KEY로 실행할 때마다 ~1시간짜리 토큰을 새로 발급받음).
# #######################################
name: Build & Push (frontend, prod)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # OIDC로 AWS 인증하는 데 필요
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: team5/ecr/qket

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 고정 키(AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) 대신 OIDC로 인증 —
      # 장기 자격증명을 GitHub 시크릿에 안 둠 (CI 도구 선택 ADR에서 결정한 방향).
      # AWS_GITHUB_ACTIONS_ROLE_ARN — Infra/registry의 github_actions_oidc 모듈(repos.frontend)이
      # 만드는 role. ECR push + 아래 Secrets Manager 시크릿 하나(team5-qket-external-api-*) 읽기 권한만.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # NEXT_PUBLIC_TOSS_CLIENT_KEY: Next.js가 next build 시점에 값을 JS 번들에 고정으로
      # 박아넣는 클라이언트사이드 변수라서(K8s Deployment env로는 절대 못 넣음 — 그건 런타임),
      # 여기서 미리 AWS Secrets Manager(04_data/module.eso가 만든 시크릿)에서 직접 값을 꺼내와야 함.
      # release용 워크플로우와 다른 점: 여기는 team5-qket-external-api-prod(prod 전용 시크릿)를 읽음.
      - name: Fetch Toss client key from Secrets Manager
        id: toss
        run: |
          KEY=$(aws secretsmanager get-secret-value \
            --secret-id team5-qket-external-api-prod \
            --query SecretString --output text | jq -r .TOSS_CLIENT_KEY)
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install & build
        env:
          NEXT_PUBLIC_TOSS_CLIENT_KEY: ${{ steps.toss.outputs.key }}
        run: |
          npm ci
          npm run build

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 이미지 태그: frontend-{커밋SHA 앞 7글자}
      - name: Compute image tag
        id: tag
        run: echo "tag=frontend-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG
          echo "Pushed image: $REGISTRY/$ECR_REPOSITORY:$TAG"

      # qket-ci-bot GitHub App으로 qKet/CD 레포에만 유효한 단명 토큰 발급.
      - name: Get GitHub App token for CD repo
        id: cd-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.QKET_CI_APP_ID }}
          private-key: ${{ secrets.QKET_CI_APP_PRIVATE_KEY }}
          owner: qKet
          repositories: CD

      - name: Checkout qKet/CD
        uses: actions/checkout@v4
        with:
          repository: qKet/CD
          token: ${{ steps.cd-app-token.outputs.token }}
          path: cd-repo

      # helm/values-prod.yaml의 "frontend:" 블록 안 첫 image 줄만 찾아서 값 교체 — release와
      # 달리 이 파일은 helm/values-release.yaml 위에 얹히는 오버레이라 image 필드가 명시적으로
      # 있어야 함(안 그러면 release 값을 그대로 상속해버림, CD/helm/values-prod.yaml 참고).
      - name: Update image tag in qKet/CD
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          cd cd-repo
          sed -i -E "/^frontend:/,/^[a-zA-Z]/ s|^(  image: ).*|\1$IMAGE|" helm/values-prod.yaml
          git config user.name "qket-ci-bot[bot]"
          git config user.email "qket-ci-bot[bot]@users.noreply.github.com"
          git add helm/values-prod.yaml
          git diff --cached --quiet && echo "No image change, skip commit" && exit 0
          git commit -m "chore: update frontend(prod) image to $TAG"
          git push
